name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-build.txt
      - name: Build app
        run: >
          pyinstaller --noconfirm --windowed --name "YouTube to MP4"
          --add-data "templates;templates"
          --collect-all yt_dlp --collect-all imageio_ffmpeg --collect-all certifi
          launcher.py
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/YouTube-to-MP4-Setup.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build dmg
        run: |
          python -m venv .venv-build
          PYTHON=.venv-build/bin/python ./build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/YouTube-to-MP4-mac.dmg
